<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor de moneda</title>
<style>
  :root{
    --bg:#ffffff; --fg:#37352f; --muted:#787774; --line:#e9e9e7;
    --card:#f7f7f5; --accent:#2383e2; --accentsoft:#e7f1fb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#191919; --fg:#e6e6e4; --muted:#9b9b98; --line:#2f2f2f;
           --card:#242424; --accent:#5aa9f0; --accentsoft:#1c2a38; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       padding:14px;}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
  .spacer{flex:1}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{background:transparent;color:var(--muted);border:0;padding:5px 13px;
              font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .conv{display:flex;align-items:stretch;gap:8px;flex-wrap:nowrap}
  .box{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);
       border-radius:11px;padding:10px 12px}
  .box .cur{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
  .box input{width:100%;border:0;background:transparent;color:var(--fg);
             font:inherit;font-size:22px;font-weight:600;padding:0;outline:none;
             letter-spacing:-.02em}
  .box input::placeholder{color:var(--line)}
  .swap{flex:0 0 auto;align-self:center;background:var(--accentsoft);color:var(--accent);
        border:0;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;
        display:flex;align-items:center;justify-content:center}
  .swap:hover{filter:brightness(.96)}
  .rate{margin-top:11px;font-size:12px;color:var(--muted)}
  .rate b{color:var(--fg);font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;
        padding:4px 11px;font-size:12px;cursor:pointer;color:var(--muted)}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .panel{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .panel label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
  select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);
         border-radius:6px;background:var(--bg);color:var(--fg)}
  button.link{background:transparent;border:0;color:var(--muted);font:inherit;font-size:12px;
              cursor:pointer;padding:0;text-decoration:underline}
  .msg{padding:14px;color:var(--muted);font-size:13px}
  .err{color:#c4554d}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div id="app"><div class="msg">Cargando tipos de cambio...</div></div>

<script>
// Monedas ofrecidas en el selector. El sistema usa las primeras; el resto son de cortesia.
var MONEDAS = [
  ["USD","Dolar estadounidense"], ["CRC","Colon costarricense"], ["COP","Peso colombiano"],
  ["PEN","Sol peruano"], ["BRL","Real brasileno"], ["EUR","Euro"], ["MXN","Peso mexicano"],
  ["CHF","Franco suizo"], ["JOD","Dinar jordano"], ["EGP","Libra egipcia"],
  ["CNY","Yuan chino"], ["INR","Rupia india"], ["JPY","Yen japones"], ["ISK","Corona islandesa"],
  ["GBP","Libra esterlina"], ["CAD","Dolar canadiense"], ["AUD","Dolar australiano"],
  ["THB","Baht tailandes"], ["AED","Dirham emirati"], ["MAD","Dirham marroqui"],
  ["TRY","Lira turca"], ["ARS","Peso argentino"], ["CLP","Peso chileno"], ["PAB","Balboa panameno"]
];
var SIN_DECIMALES = ["CRC","COP","JPY","ISK","CLP","KRW","VND","PYG","IDR","HUF"];

var qs = new URLSearchParams(location.search);
var LOCAL_URL = (qs.get("local") || "").toUpperCase();
var NOMBRE    = qs.get("name") || "";

var KEY_BASE = "moneda:base";      // preferencia global: USD o CRC
var KEY_LOCAL = "moneda:local:" + (LOCAL_URL || "manual");

function getSaved(k, def){ try { return localStorage.getItem(k) || def; } catch(e){ return def; } }
function setSaved(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

var state = {
  base:  getSaved(KEY_BASE, "USD"),                  // moneda de casa
  local: LOCAL_URL || getSaved(KEY_LOCAL, "COP"),    // moneda del destino; la URL manda
  invertido: false,
  rates: null,
  fecha: ""
};

function decimales(cur, v){
  var a = Math.abs(v);
  // Los valores muy pequenos (ej. 1 COP en USD) necesitan precision o se ven como "0".
  if (a > 0 && a < 0.01) return 6;
  if (a > 0 && a < 1)    return 4;
  if (SIN_DECIMALES.indexOf(cur) !== -1) return 0;
  return a >= 1000 ? 0 : 2;
}
function fmt(v, cur){
  if (!isFinite(v)) return "";
  try {
    return new Intl.NumberFormat("es-ES", {
      minimumFractionDigits: 0, maximumFractionDigits: decimales(cur, v), useGrouping: "always"
    }).format(v);
  } catch(e){ return String(Math.round(v*100)/100); }
}
// Acepta "1.000", "1000,50", "1.234,56" y "1,234.56"
function parseNum(s){
  s = String(s).replace(/[^\d.,-]/g, "");
  if (!s) return NaN;
  var m = s.match(/[.,](\d{1,2})$/);
  if (m){
    var head = s.slice(0, s.length - m[0].length).replace(/[.,]/g, "");
    return parseFloat(head + "." + m[1]);
  }
  return parseFloat(s.replace(/[.,]/g, ""));
}
function convertir(v, de, a){
  if (!state.rates || !state.rates[de] || !state.rates[a]) return NaN;
  return v * state.rates[a] / state.rates[de];
}
function ladoIzq(){ return state.invertido ? state.base  : state.local; }
function ladoDer(){ return state.invertido ? state.local : state.base;  }

function atajos(){
  var r = state.rates ? state.rates[ladoIzq()] : 1;   // unidades por USD
  if (r > 500)  return [1000, 5000, 10000, 50000];
  if (r > 20)   return [100, 500, 1000, 5000];
  return [5, 10, 25, 100];
}

function pintar(){
  var izq = ladoIzq(), der = ladoDer();
  var mismo = izq === der;
  var unaUnidad = convertir(1, izq, der);

  document.getElementById("app").innerHTML =
      '<div class="top">'
    + '<h1>' + (NOMBRE ? NOMBRE : "Conversor") + '</h1>'
    + '<span class="spacer"></span>'
    + '<div class="seg">'
    +   '<button id="bUSD" class="' + (state.base === "USD" ? "on" : "") + '">USD</button>'
    +   '<button id="bCRC" class="' + (state.base === "CRC" ? "on" : "") + '">CRC</button>'
    + '</div></div>'

    + '<div class="conv">'
    + '<div class="box"><div class="cur">' + izq + '</div>'
    +   '<input id="in1" inputmode="decimal" placeholder="0"></div>'
    + '<button class="swap" id="swap" title="Invertir">&#8646;</button>'
    + '<div class="box"><div class="cur">' + der + '</div>'
    +   '<input id="in2" inputmode="decimal" placeholder="0"></div>'
    + '</div>'

    + '<div class="rate">' + (mismo
        ? 'Es la misma moneda.'
        : '1 ' + izq + ' = <b>' + fmt(unaUnidad, der) + ' ' + der + '</b>'
          + '&nbsp;&middot;&nbsp; 1 ' + der + ' = <b>' + fmt(convertir(1, der, izq), izq) + ' ' + izq + '</b>')
    + (state.fecha ? '<br>Tipo de cambio actualizado el ' + state.fecha + '.' : '')
    + '</div>'

    + '<div class="chips">' + atajos().map(function(n){
        return '<span class="chip" data-n="' + n + '">' + fmt(n, izq) + ' ' + izq + '</span>';
      }).join("") + '</div>'

    + '<div class="panel">'
    + '<label>Moneda del destino</label>'
    + '<select id="sel">' + MONEDAS.map(function(m){
        return '<option value="' + m[0] + '"' + (m[0] === state.local ? " selected" : "") + '>'
             + m[0] + ' — ' + m[1] + '</option>';
      }).join("") + '</select>'
    + (LOCAL_URL ? ' <button class="link" id="reset">volver a ' + LOCAL_URL + '</button>' : '')
    + '</div>';

  conectar();
}

function conectar(){
  var in1 = document.getElementById("in1"), in2 = document.getElementById("in2");
  in1.oninput = function(){
    var v = parseNum(in1.value);
    in2.value = isFinite(v) ? fmt(convertir(v, ladoIzq(), ladoDer()), ladoDer()) : "";
  };
  in2.oninput = function(){
    var v = parseNum(in2.value);
    in1.value = isFinite(v) ? fmt(convertir(v, ladoDer(), ladoIzq()), ladoIzq()) : "";
  };
  document.getElementById("swap").onclick = function(){
    state.invertido = !state.invertido; pintar();
  };
  document.getElementById("bUSD").onclick = function(){
    state.base = "USD"; setSaved(KEY_BASE, "USD"); pintar();
  };
  document.getElementById("bCRC").onclick = function(){
    state.base = "CRC"; setSaved(KEY_BASE, "CRC"); pintar();
  };
  document.getElementById("sel").onchange = function(e){
    state.local = e.target.value; setSaved(KEY_LOCAL, state.local); pintar();
  };
  var rs = document.getElementById("reset");
  if (rs) rs.onclick = function(){
    state.local = LOCAL_URL; setSaved(KEY_LOCAL, LOCAL_URL); pintar();
  };
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){
    c.onclick = function(){
      in1.value = c.getAttribute("data-n");
      in1.oninput();
    };
  });
}

fetch("https://open.er-api.com/v6/latest/USD")
  .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(j){
    if (j.result !== "success") throw new Error("respuesta inesperada de la API");
    state.rates = j.rates;
    var d = j.time_last_update_utc ? new Date(j.time_last_update_utc) : null;
    state.fecha = d ? d.getUTCDate() + " "
      + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][d.getUTCMonth()]
      : "";
    pintar();
  })
  .catch(function(err){
    document.getElementById("app").innerHTML =
      '<div class="msg err">No se pudieron cargar los tipos de cambio: ' + err.message + '</div>';
  });
</script>
</body>
</html>
