<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor de moneda</title>
<style>
  :root{
    --bg:#ffffff; --fg:#37352f; --muted:#787774; --line:#e9e9e7;
    --card:#f7f7f5; --accent:#2383e2; --accentsoft:#e7f1fb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#191919; --fg:#e6e6e4; --muted:#9b9b98; --line:#2f2f2f;
           --card:#242424; --accent:#5aa9f0; --accentsoft:#1c2a38; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       padding:14px;}
  .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--muted)}
  .conv{display:flex;gap:8px;flex-wrap:wrap}
  .box{flex:1 1 150px;min-width:140px;background:var(--card);
       border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .box.local{border-color:var(--accent);background:var(--accentsoft)}
  .box .cur{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);
            display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .box.local .cur{color:var(--accent)}
  .box .cur em{font-style:normal;font-weight:500;font-size:10px;opacity:.85;
               text-transform:none;letter-spacing:0}
  .box input{width:100%;border:0;background:transparent;color:var(--fg);
             font:inherit;font-size:22px;font-weight:600;padding:2px 0 0;outline:none;
             letter-spacing:-.02em}
  .box input::placeholder{color:var(--line)}
  .rate{margin-top:11px;font-size:12px;color:var(--muted)}
  .rate b{color:var(--fg);font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;
        padding:4px 11px;font-size:12px;cursor:pointer;color:var(--muted)}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.clear{border-style:dashed}
  .panel{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
         display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap}
  .panel label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
  select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);
         border-radius:6px;background:var(--bg);color:var(--fg);max-width:100%}
  button.link{background:transparent;border:0;color:var(--muted);font:inherit;font-size:12px;
              cursor:pointer;padding:0 0 7px;text-decoration:underline}
  .msg{padding:14px;color:var(--muted);font-size:13px}
  .err{color:#c4554d}
</style>
</head>
<body>
<div id="app"><div class="msg">Cargando tipos de cambio...</div></div>

<script>
var CASA = ["USD", "CRC"];   // las dos monedas propias, siempre visibles
var SIN_DECIMALES = ["CRC","COP","JPY","ISK","CLP","KRW","VND","PYG","IDR","HUF","XAF","XOF","XPF","RWF","UGX","IQD","LAK","MGA","MMK","TZS","GNF","KMF","DJF","BIF","VUV"];
// Monedas que salen primero en el selector: las propias + las de los destinos del sistema.
var FRECUENTES = ["USD","CRC","COP","PEN","BRL","EUR","MXN","CHF","JOD","EGP","CNY","INR","JPY","ISK"];

var qs = new URLSearchParams(location.search);
var LOCAL_URL = (qs.get("local") || "").toUpperCase();
var NOMBRE    = qs.get("name") || "";
var KEY_LOCAL = "moneda:local:" + (LOCAL_URL || "manual");

function getSaved(k, d){ try { return localStorage.getItem(k) || d; } catch(e){ return d; } }
function setSaved(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

var state = {
  local: LOCAL_URL || getSaved(KEY_LOCAL, "COP"),   // la URL manda sobre la memoria
  rates: null,
  fecha: ""
};

// Nombres de moneda que da el propio navegador: cubre las 166 sin lista fija que mantener.
var DN = null;
try { DN = new Intl.DisplayNames(["es"], { type: "currency" }); } catch(e){}
function nombreMoneda(c){
  if (!DN) return c;
  try { var n = DN.of(c); return (n && n !== c) ? n : c; } catch(e){ return c; }
}

function decimales(cur, v){
  var a = Math.abs(v);
  if (a > 0 && a < 0.01) return 6;   // si no, "1 COP = 0 USD"
  if (a > 0 && a < 1)    return 4;
  if (SIN_DECIMALES.indexOf(cur) !== -1) return 0;
  return a >= 1000 ? 0 : 2;
}
function fmt(v, cur){
  if (!isFinite(v)) return "";
  try {
    return new Intl.NumberFormat("es-ES", {
      minimumFractionDigits: 0, maximumFractionDigits: decimales(cur, v), useGrouping: "always"
    }).format(v);
  } catch(e){ return String(Math.round(v * 100) / 100); }
}
// Las TASAS necesitan decimales aunque la moneda no los use en importes:
// "1 CRC = 7 COP" es falso; lo correcto es 6,96.
function fmtTasa(v){
  var a = Math.abs(v), d = a < 0.01 ? 6 : a < 1 ? 4 : a < 100 ? 2 : 0;
  try {
    return new Intl.NumberFormat("es-ES", {
      minimumFractionDigits: 0, maximumFractionDigits: d, useGrouping: "always"
    }).format(v);
  } catch(e){ return String(v); }
}
// Acepta "1.000", "1000,50", "1.234,56" y "1,234.56"
function parseNum(s){
  s = String(s).replace(/[^\d.,-]/g, "");
  if (!s) return NaN;
  var m = s.match(/[.,](\d{1,2})$/);
  if (m){
    var head = s.slice(0, s.length - m[0].length).replace(/[.,]/g, "");
    return parseFloat(head + "." + m[1]);
  }
  return parseFloat(s.replace(/[.,]/g, ""));
}
function convertir(v, de, a){
  if (!state.rates || !state.rates[de] || !state.rates[a]) return NaN;
  return v * state.rates[a] / state.rates[de];
}

// Columnas a mostrar: la local + USD + CRC, sin repetir si la local ya es una de ellas.
function columnas(){
  var out = [state.local];
  CASA.forEach(function(c){ if (out.indexOf(c) === -1) out.push(c); });
  return out;
}
function atajos(){
  var r = state.rates ? state.rates[state.local] : 1;   // unidades por dolar
  if (r > 500) return [1000, 5000, 10000, 50000];
  if (r > 20)  return [100, 500, 1000, 5000];
  return [5, 10, 25, 100];
}

function opcionesSelector(){
  var todas = Object.keys(state.rates).sort();
  var resto = todas.filter(function(c){ return FRECUENTES.indexOf(c) === -1; });
  function opt(c){
    return '<option value="' + c + '"' + (c === state.local ? " selected" : "") + '>'
         + c + ' — ' + nombreMoneda(c) + '</option>';
  }
  return '<optgroup label="Frecuentes">' + FRECUENTES.filter(function(c){ return todas.indexOf(c) !== -1; }).map(opt).join("") + '</optgroup>'
       + '<optgroup label="Todas (' + todas.length + ')">' + resto.map(opt).join("") + '</optgroup>';
}

function pintar(){
  var cols = columnas();
  var loc  = state.local;

  var cajas = cols.map(function(c){
    var esLocal = (c === loc);
    return '<div class="box' + (esLocal ? " local" : "") + '">'
      + '<div class="cur"><span>' + c + '</span>'
      + '<em>' + (esLocal ? "moneda local" : nombreMoneda(c)) + '</em></div>'
      + '<input id="in_' + c + '" data-cur="' + c + '" inputmode="decimal" placeholder="0">'
      + '</div>';
  }).join("");

  var tasas = cols.filter(function(c){ return c !== loc; }).map(function(c){
    return '1 ' + c + ' = <b>' + fmtTasa(convertir(1, c, loc)) + ' ' + loc + '</b>';
  }).join('&nbsp;&middot;&nbsp; ');

  document.getElementById("app").innerHTML =
      '<div class="top"><h1>' + (NOMBRE || "Conversor") + '</h1>'
    + '<span class="sub">' + nombreMoneda(loc) + '</span></div>'
    + '<div class="conv">' + cajas + '</div>'
    + '<div class="rate">' + (cols.length > 1 ? tasas : "Es tu misma moneda.")
    + (state.fecha ? '<br>Tipo de cambio actualizado el ' + state.fecha + '.' : '') + '</div>'
    + '<div class="chips">'
    +   atajos().map(function(n){ return '<span class="chip" data-n="' + n + '">' + fmt(n, loc) + ' ' + loc + '</span>'; }).join("")
    +   '<span class="chip clear" id="clear">Limpiar</span>'
    + '</div>'
    + '<div class="panel"><div><label>Moneda del destino</label>'
    + '<select id="sel">' + opcionesSelector() + '</select></div>'
    + (LOCAL_URL && state.local !== LOCAL_URL ? '<button class="link" id="reset">volver a ' + LOCAL_URL + '</button>' : '')
    + '</div>';

  conectar();
}

function conectar(){
  var inputs = Array.prototype.slice.call(document.querySelectorAll("[data-cur]"));

  function propagar(origen){
    var de = origen.getAttribute("data-cur");
    var v  = parseNum(origen.value);
    inputs.forEach(function(el){
      if (el === origen) return;
      var a = el.getAttribute("data-cur");
      el.value = isFinite(v) ? fmt(convertir(v, de, a), a) : "";
    });
  }
  inputs.forEach(function(el){ el.oninput = function(){ propagar(el); }; });

  document.getElementById("sel").onchange = function(e){
    state.local = e.target.value; setSaved(KEY_LOCAL, state.local); pintar();
  };
  var rs = document.getElementById("reset");
  if (rs) rs.onclick = function(){
    state.local = LOCAL_URL; setSaved(KEY_LOCAL, LOCAL_URL); pintar();
  };
  document.getElementById("clear").onclick = function(){
    inputs.forEach(function(el){ el.value = ""; });
    if (inputs[0]) inputs[0].focus();
  };
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-n]"), function(c){
    c.onclick = function(){
      var first = document.querySelector('[data-cur="' + state.local + '"]');
      if (!first) return;
      first.value = c.getAttribute("data-n");
      first.oninput();
    };
  });
}

fetch("https://open.er-api.com/v6/latest/USD")
  .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(j){
    if (j.result !== "success") throw new Error("respuesta inesperada de la API");
    state.rates = j.rates;
    if (!state.rates[state.local]) state.local = "USD";   // por si llega un codigo raro
    var d = j.time_last_update_utc ? new Date(j.time_last_update_utc) : null;
    state.fecha = d ? d.getUTCDate() + " "
      + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][d.getUTCMonth()]
      : "";
    pintar();
  })
  .catch(function(err){
    document.getElementById("app").innerHTML =
      '<div class="msg err">No se pudieron cargar los tipos de cambio: ' + err.message + '</div>';
  });
</script>
</body>
</html>
